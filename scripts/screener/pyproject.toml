[project]
name = "roy-equity-screener"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["duckdb==2.0.1", "polars==2.2.0", "yfinance==1.8.0", "httpx==0.28.1", "exchange-calendars==4.13.3"]
[project.optional-dependencies]
test = ["pytest>=9,<10"]
[project.scripts]
roy-screen = "roy_screener.cli:main"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
