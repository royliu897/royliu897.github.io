name: Screener checks
on:
  push:
    branches: [main]
    paths: ['assets/screener/**', 'screener.html', 'scripts/screener/**', 'tests/screener-tests.mjs', '.github/workflows/screener-checks.yml']
  pull_request:
    paths: ['assets/screener/**', 'screener.html', 'scripts/screener/**', 'tests/screener-tests.mjs', '.github/workflows/screener-checks.yml']
permissions:
  contents: read
jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -e './scripts/screener[test]'
      - run: python -m pytest scripts/screener/tests -q
      - run: node tests/screener-tests.mjs
      - run: python scripts/screener/build_frontend.py
      - run: git diff --exit-code -- assets/screener screener.html
