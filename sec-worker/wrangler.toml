name = "roy-research-sec"
main = "worker.mjs"
compatibility_date = "2026-10-19"
workers_dev = false
preview_urls = false
[[routes]]
pattern = "research-api.royrliu.com"
custom_domain = true
[vars]
SITE_ORIGIN = "https://royrliu.com"
SEC_USER_AGENT = "Roy Liu Research Desk royrliu@utexas.edu"
[[ratelimits]]
name = "CLIENT_LIMIT"
namespace_id = "2026101901"
simple = { limit = 60, period = 60 }
[[ratelimits]]
name = "UPSTREAM_LIMIT"
namespace_id = "2026101902"
simple = { limit = 30, period = 60 }

[[durable_objects.bindings]]
name = "FILING_CACHE"
class_name = "FilingIngestionObject"

[[migrations]]
tag = "filing-ingestion-v1"
new_sqlite_classes = ["FilingIngestionObject"]
